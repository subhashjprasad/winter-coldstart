<html>
    <head>
        <title>Winter Coldstart</title>

        <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet" />

        <style>
            html, body {
                height: 100%;
            }

            body {
                background-color: #ffffff;
                color: #000000;
                font-family: "Crimson Pro", serif;
                padding-left: 20px;
                padding-right: 20px;
                padding-bottom: 30px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            h1 {
                font-size: 64px;
                font-weight: normal;
                margin-top: 20px;
            }

            p {
                font-size: 28px;
                margin-top: -20px;
            }

            .calendar {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                grid-template-rows: repeat(5, 1fr);
                gap: 8px;
                margin-top: 20px;
                flex: 1;
                min-height: 0;
            }

            .calendar a {
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "Crimson Pro", serif;
                font-size: 28px;
                color: #000000;
                text-decoration: none;
                border: 1px solid #000000;
            }

            .calendar a:hover {
                background-color: #000000;
                color: #ffffff;
            }
        </style>
    </head>

    <body>
        <h1>winter coldstart</h1>
        <p>a coding advent calendar inspired by <a href="https://adventofcode.com">https://adventofcode.com</a></p>

        <div class="calendar">
            <a href="/day1">1</a>
            <a href="/day2">2</a>

            <a href="/day18">18</a>

    </body>
</html>
